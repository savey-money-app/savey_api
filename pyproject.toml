[project]
name = "savey-api"
version = "0.1.0"
description = "Savey API - Money tracking microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.1",
    "fastapi>=0.128.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.0.0",
    "pytest>=9.0.2",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.22",
]

[tool.pytest.ini_options]
addopts = "--cov=api --cov=core --cov=models --cov=routes --cov=schemas --cov=services --cov-report=term-missing --cov-fail-under=95"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pyrefly>=0.45.2",
    "ruff>=0.14.10",
]
