version: '3.8'

networks:
  shared:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    container_name: savey_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shared
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: savey_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shared
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  savey_api:
    platform: linux/amd64
    command: bash -lc "uv run uvicorn api:app --host 0.0.0.0 --port 8000 --reload"
    build: .
    container_name: savey_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - shared
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g


volumes:
  redis_data: